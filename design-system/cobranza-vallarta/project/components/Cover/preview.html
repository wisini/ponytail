<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cobranza Vallarta</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--fondo); color:var(--tinta); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .cobalto { fill:var(--cobalto); }
  .remolino { fill:var(--remolino); }
  .estrella { fill:var(--estrella); }
  .swirl { fill:none; stroke:var(--fondo); stroke-width:6px; stroke-linecap:round; }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.95; font-weight:600; color:var(--tinta); }
  .tag { margin:var(--space-3) 0 0 4px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--tinta-suave); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      cobalto 208x280 bled off the top (the night sky, largest) · remolino 112x176 (the swirl blue) · estrella disc r56 (the moon, white by night, navy by day) — about 33% of 960x288
  arrangement one tall cobalto slab, a shorter remolino satellite, the moon disc high on the right like the painting's crescent; slab and satellite bottoms on one line space-6 above the edge
  pattern     swirl arcs, from "looks like Starry Night": four 260-degree arcs cut out of the cobalto slab in fondo, radii stepping by space-6 minus a bit, each rotated, reading as one spiral
  scales      gutters space-4; bottom inset space-6; corners radius-lg; the disc is radius-full
-->
<rect class="cobalto blk" x="16" y="-16" width="208" height="280" rx="22"/>
<path class="swirl" d="M101.2 121.2 A20 20 0 1 1 116.5 147.7"/>
<path class="swirl" d="M97.1 95.2 A40 40 0 1 1 91.7 156.3"/>
<path class="swirl" d="M120.0 68.0 A60 60 0 1 1 60.9 138.4"/>
<path class="swirl" d="M165.9 62.5 A80 80 0 1 1 47.5 94.2"/>
<rect class="remolino blk" x="240" y="88" width="112" height="176" rx="22"/>
<circle class="estrella" cx="424" cy="96" r="56"/>
</svg>
</div>
<div class="words">
<h1 class="name">Cobranza Vallarta</h1>
<p class="tag">No dice mucho. Cobra a tiempo.</p>
</div>
</div>
</body>
</html>
