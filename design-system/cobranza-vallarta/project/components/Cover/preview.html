<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cobranza Vallarta</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--fondo); color:var(--tinta); font-family:var(--font-mono); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .sol { fill:var(--sol); }
  .bahia { fill:var(--bahia); }
  .deep { fill:var(--tinta); }
  .pagado { fill:var(--pagado); }
  .cut { fill:var(--fondo); }
  .blk { rx:var(--radius-lg); }
  .chip { rx:var(--radius-xs); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:700; letter-spacing:-.02em; color:var(--tinta); }
  .tag { margin:var(--space-3) 0 0 4px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--tinta-suave); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      sol 192x252 bled off the top (the one brand hue, largest) · bahia 128x168 (the Pacific) · tinta 120x216 bleeding off the right edge (the terminal ink) · pagado 96x24 chip once (it only means paid) — about 35% of 960x288
  arrangement one tall sol slab with two satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     dot grid, from "mono carries the brand" and the space-4 terminal grid: 3px dots at a 24px (space-6) pitch cut out of the sol slab in fondo, thinning toward the top-left like a sunset fading
  scales      gutters space-4; bottom inset space-6; dot pitch space-6; corners radius-lg on blocks, radius-xs on the chip
-->
<rect class="sol blk" x="16" y="-12" width="192" height="252" rx="12"/>
<circle class="cut" cx="152" cy="96" r="3"/>
<circle class="cut" cx="176" cy="96" r="3"/>
<circle class="cut" cx="128" cy="120" r="3"/>
<circle class="cut" cx="152" cy="120" r="3"/>
<circle class="cut" cx="176" cy="120" r="3"/>
<circle class="cut" cx="104" cy="144" r="3"/>
<circle class="cut" cx="128" cy="144" r="3"/>
<circle class="cut" cx="152" cy="144" r="3"/>
<circle class="cut" cx="176" cy="144" r="3"/>
<circle class="cut" cx="80" cy="168" r="3"/>
<circle class="cut" cx="104" cy="168" r="3"/>
<circle class="cut" cx="128" cy="168" r="3"/>
<circle class="cut" cx="152" cy="168" r="3"/>
<circle class="cut" cx="176" cy="168" r="3"/>
<circle class="cut" cx="56" cy="192" r="3"/>
<circle class="cut" cx="80" cy="192" r="3"/>
<circle class="cut" cx="104" cy="192" r="3"/>
<circle class="cut" cx="128" cy="192" r="3"/>
<circle class="cut" cx="152" cy="192" r="3"/>
<circle class="cut" cx="176" cy="192" r="3"/>
<circle class="cut" cx="56" cy="216" r="3"/>
<circle class="cut" cx="80" cy="216" r="3"/>
<circle class="cut" cx="104" cy="216" r="3"/>
<circle class="cut" cx="128" cy="216" r="3"/>
<circle class="cut" cx="152" cy="216" r="3"/>
<circle class="cut" cx="176" cy="216" r="3"/>
<rect class="pagado chip" x="16" y="248" width="96" height="16" rx="2"/>
<rect class="bahia blk" x="224" y="96" width="128" height="168" rx="12"/>
<rect class="deep blk" x="368" y="48" width="128" height="216" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Cobranza Vallarta</h1>
<p class="tag">No dice mucho. Cobra a tiempo.</p>
</div>
</div>
</body>
</html>
